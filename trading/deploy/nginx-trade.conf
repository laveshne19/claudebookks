# Nginx site for trade.nalandaenterprises.com
# Reverse-proxies to the Auto-Trader app on 127.0.0.1:8080 and proxies the
# WebSocket used by the live dashboard.
#
# Install:
#   sudo cp deploy/nginx-trade.conf /etc/nginx/sites-available/trade.nalandaenterprises.com
#   sudo ln -s /etc/nginx/sites-available/trade.nalandaenterprises.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then enable HTTPS (this rewrites the file to add the 443 block + redirect):
#   sudo certbot --nginx -d trade.nalandaenterprises.com

server {
    listen 80;
    listen [::]:80;
    server_name trade.nalandaenterprises.com;

    # Allow Let's Encrypt HTTP-01 challenge files.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (the dashboard's live /ws stream).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
