# Nalanda ERP — full stack (MongoDB + FastAPI backend + React/nginx frontend)
# Usage:  cp .env.example .env  &&  edit .env  &&  docker compose up -d --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Internal only — not published to the host. Uncomment to inspect locally.
    # ports:
    #   - "127.0.0.1:27017:27017"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-nalanda_erp}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nalanda.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN:-}
      ZOHO_ORGANIZATION_ID: ${ZOHO_ORGANIZATION_ID:-}
      ZOHO_REGION: ${ZOHO_REGION:-}
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  mongo_data:
